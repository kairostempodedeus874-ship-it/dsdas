services:
  - type: web
    name: dentalia-whatsapp
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: TZ
        value: America/Sao_Paulo
      - key: BRIDGE_URL
        sync: false
      - key: WA_BRIDGE_SECRET
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AUTH_DIR
        value: /var/data/auth
    disk:
      name: wa-session
      mountPath: /var/data
      sizeGB: 1
